<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEMON ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Plus+Jakarta+Sans:ital,wght@0,600;0,800;1,800&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfbf7;
      --lemon-main: #fff275;
      --lemon-soft: #fffbe3;
      --pink-soft: #ffe8ec;
      --pink-text: #e06d85;
      --sage-soft: #eaf2e3;
      --sage-text: #52794c;
      --blue-soft: #e3effa;
      --blue-text: #4a779d;
      --text-dark: #232220;
      --text-muted: #8c887b;
      --border-subtle: #f0ebd8;
      --shadow-pin: 0 16px 32px -8px rgba(224, 206, 144, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      line-height: 1.6;
      background-image: radial-gradient(#faeec8 0.8px, transparent 0.8px);
      background-size: 24px 24px;
    }
    .en-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    header {
      backdrop-filter: blur(12px);
      background-color: rgba(253, 251, 247, 0.88);
      border-bottom: 1.5px solid var(--border-subtle);
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-badge {
      background: var(--lemon-main);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #5c4e00;
    }
    .logo-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      color: var(--text-dark);
    }
    .nav-btn {
      background: var(--text-dark);
      color: var(--lemon-main);
      padding: 10px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-btn:hover {
      transform: scale(1.04);
      background-color: #000000;
    }

    .container {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 24px;
    }
    .hero-banner {
      background: linear-gradient(135deg, #fff9db 0%, #fff1f3 50%, #edf7ee 100%);
      border: 1.5px solid #f5edda;
      border-radius: 28px;
      padding: 36px 32px;
      margin-bottom: 36px;
    }
    .hero-tag {
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8c7827;
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 검색 & 필터 */
    .search-filter-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .search-bar input {
      width: 100%;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1.5px solid var(--border-subtle);
      background-color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
    }
    .search-bar input:focus {
      border-color: #ffd633;
      box-shadow: 0 6px 20px rgba(255, 230, 0, 0.2);
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-pill {
      border: 1.5px solid var(--border-subtle);
      background: #ffffff;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: var(--lemon-main);
      color: var(--text-dark);
      border-color: #fae143;
      font-weight: 700;
    }

    /* 카드 그리드 & 로딩 */
    .pins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 30px;
    }
    .pin-card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      border: 1.5px solid var(--border-subtle);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-pin);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pin-card:hover {
      transform: translateY(-8px) rotate(-0.5deg);
      box-shadow: 0 24px 40px -10px rgba(214, 186, 92, 0.35);
      border-color: #fae382;
    }
    .pin-image-box {
      width: 100%;
      height: 250px;
      overflow: hidden;
      position: relative;
      background: var(--lemon-soft);
    }
    .pin-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pin-tag-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tag-pink { background: rgba(255, 232, 236, 0.92); color: var(--pink-text); }
    .tag-sage { background: rgba(234, 242, 227, 0.92); color: var(--sage-text); }
    .tag-blue { background: rgba(227, 239, 250, 0.92); color: var(--blue-text); }

    .pin-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .pin-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.4px;
    }
    .pin-author {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .pin-footer {
      margin-top: auto;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border-subtle);
    }
    .pin-date {
      font-size: 0.8rem;
      color: #aaa292;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo-box">
        <span class="logo-badge">lemon club</span>
        <span class="logo-text">archive.</span>
      </a>
      <a href="write.html" class="nav-btn">+ add pin</a>
    </div>
  </header>

  <div class="container">
    <div class="hero-banner">
      <span class="hero-tag">Aesthetic Book Journal</span>
      <h1 class="hero-title">잘 익은 생각들의🍋</h1>
      <p class="hero-desc">구글 스프레드시트에 보관된 소중한 독서 기록들을 실시간으로 보여줍니다.</p>
    </div>

    <div class="search-filter-wrap">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 책 제목이나 작가명을 검색해 보세요...">
      </div>
      <div class="filter-pills" id="filterContainer">
        <button class="filter-pill active" data-genre="all">all</button>
        <button class="filter-pill" data-genre="소설">소설</button>
        <button class="filter-pill" data-genre="인문/철학">인문/철학</button>
        <button class="filter-pill" data-genre="경제/경영">경제/경영</button>
        <button class="filter-pill" data-genre="자기계발">자기계발</button>
        <button class="filter-pill" data-genre="에세이">에세이</button>
      </div>
    </div>

    <main class="pins-grid" id="bookGrid">
      <div class="status-msg">🍋 스프레드시트에서 서평을 불러오는 중...</div>
    </main>
  </div>

  <footer>
    <p class="en-font">© 2026 lemon archive. powered by google sheets.</p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvndYo2Tku86kNgo7261nGuXM-lvr0EP9V8wvzibqZ7zdRrDTkU_Qgoeb0Oy6Ia00/exec";
    let allBooks = [];
    let currentGenre = "all";

    // 기본 표지 이미지 샘플들
    const defaultCovers = [
      "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=600&q=80"
    ];

    const tagClasses = ['tag-pink', 'tag-sage', 'tag-blue'];

    async function fetchBooks() {
      const grid = document.getElementById('bookGrid');
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        
        if (result.status === 'success') {
          allBooks = result.data.reverse(); // 최신순 정렬
          renderBooks();
        } else {
          grid.innerHTML = '<div class="status-msg">데이터를 불러오지 못했습니다.</div>';
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="status-msg">네트워크 통신 중 오류가 발생했습니다.</div>';
      }
    }

    function renderBooks() {
      const grid = document.getElementById('bookGrid');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allBooks.filter(book => {
        const matchesGenre = (currentGenre === 'all') || (book.genre && book.genre.includes(currentGenre));
        const matchesKeyword = (book.title && book.title.toLowerCase().includes(keyword)) ||
                               (book.author && book.author.toLowerCase().includes(keyword));
        return matchesGenre && matchesKeyword;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="status-msg">등록된 책 후기가 없습니다. 첫 후기를 작성해보세요! 🍋</div>';
        return;
      }

      grid.innerHTML = filtered.map((book, idx) => {
        const coverImg = defaultCovers[idx % defaultCovers.length];
        const tagClass = tagClasses[idx % tagClasses.length];
        const detailUrl = `detail.html?title=${encodeURIComponent(book.title)}&author=${encodeURIComponent(book.author)}&genre=${encodeURIComponent(book.genre)}&date=${encodeURIComponent(book.finishDate)}&cover=${encodeURIComponent(coverImg)}`;

        return `
          <a href="${detailUrl}" class="pin-card">
            <div class="pin-image-box">
              <span class="pin-tag-badge ${tagClass}">${book.genre || '기타'}</span>
              <img src="${coverImg}" alt="${book.title} 표지">
            </div>
            <div class="pin-content">
              <h2 class="pin-title">${book.title || '제목 없음'}</h2>
              <p class="pin-author">${book.author ? book.author + ' 저' : '저자 미상'}</p>
              <div class="pin-footer">
                <span class="pin-date">${book.finishDate || '-'}</span>
                <span class="en-font" style="font-size:0.8rem; color:#d1b100;">view note →</span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    // 장르 필터 버튼 이벤트
    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentGenre = e.target.dataset.genre;
        renderBooks();
      });
    });

    // 검색어 입력 이벤트
    document.getElementById('searchInput').addEventListener('input', renderBooks);

    // 실행
    fetchBooks();
  </script>
</body>
</html>
